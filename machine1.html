<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oracle Drift Engine</title>

<style>

body{
    background:#000;
    color:#00ff88;
    font-family:monospace;
    padding:40px;
}

.container{
    max-width:700px;
    margin:auto;
}

h1{
    font-weight:normal;
    letter-spacing:2px;
}

#output{
    font-size:1.3rem;
    margin-bottom:30px;
    line-height:1.6;
}

#history{

    margin-top:40px;

    border-top:1px solid #00ff88;

    padding-top:20px;

}

.oracle-entry{

    margin-bottom:20px;

    opacity:0.8;

    cursor:text;

}

</style>

</head>


<body>


<div class="container">

<h1>Oracle Drift Engine</h1>

<div id="output"></div>

<div id="history"></div>

</div>



<script>


let memoryPool = [

    "your future",

    "the signal",

    "forgotten thought",

    "unfinished language",

    "hidden pattern",

    "tomorrow's memory"

];


// What is speaking

const entities = [

    "system",

    "signal",

    "archive",

    "machine",

    "pattern",

    "dream",

    "network",

    "echo"

];


// How it is trying

const adverbs = [

    "quietly",

    "slowly",

    "desperately",

    "carefully",

    "blindly",

    "patiently",

    "secretly",

    "reluctantly"

];


// What it is trying to do

const actions = [

    "remember",

    "translate",

    "reconstruct",

    "predict",

    "recover",

    "witness",

    "decode",

    "summon"

];


// Threshold conditions

const thresholds = [

    "language fully forms",

    "memory settles",

    "the signal stabilizes",

    "meaning arrives",

    "the pattern reveals itself",

    "silence breaks"

];



function random(arr){

    return arr[Math.floor(Math.random() * arr.length)];

}



function recursiveMemory(newMemory){

    memoryPool.push(newMemory);

    if(memoryPool.length > 20){

        memoryPool.shift();

    }

}



function article(word){

    return /^[aeiou]/i.test(word) ? "An" : "A";

}



function generateOracle(){


    const entity = random(entities);

    const adverb = random(adverbs);

    const action = random(actions);

    const memory = random(memoryPool);

    const threshold = random(thresholds);



    // memory evolves

    recursiveMemory(
        `${entity} ${action} ${memory}`
    );



    return `${article(entity)} ${entity} ${adverb} attempting to ${action} ${memory} before ${threshold}.`;

}




function updateOutput(){


    const oracleText = generateOracle();



    // Current oracle

    document.getElementById("output").innerText = oracleText;



    // Archive

    const history = document.getElementById("history");



    const entry = document.createElement("div");

    entry.className="oracle-entry";

    entry.innerText=oracleText;



    // newest at top

    history.prepend(entry);


}



// Initial generation

updateOutput();



// Generate new oracle every 20 seconds

setInterval(updateOutput,2000);



</script>


</body>

</html>
